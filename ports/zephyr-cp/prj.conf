CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# Two Zephyr BT defaults that must be assigned, not defaulted. Kconfig.zephyr is
# osource'd at the top of ports/zephyr-cp/Kconfig, so Zephyr parses first and its
# unconditional `default` wins over any `config X / default Y` added there. That
# is fine for symbols Zephyr does not default (BT_GATT_DYNAMIC_DB, BT_GATT_CLIENT,
# BT_SMP); it silently no-ops for these two.
#
# Tradeoff: on boards without BT these two symbols are invisible, so Kconfig
# emits "was assigned the value ... but got no value" warnings. Non-fatal, the
# .config still generates (verified on renesas_ek_ra8d1), and ARCH_POSIX_UPDATE_
# STACK_INFO above already warns the same way. Moving them to the ~9 BT board
# .conf files instead would avoid the warnings at the cost of nine copies.

# Zephyr defaults this to 0, which its own help text says disables GATT
# long/reliable writes. Any Characteristic write larger than a single
# ATT_WRITE_REQ is refused by the host before it reaches common-hal.
CONFIG_BT_ATT_PREPARE_COUNT=2

# Zephyr's peripheral preferred supervision timeout defaults to 42, in 10ms
# units, so 420ms. BT_GAP_AUTO_UPDATE_CONN_PARAMS is also y by default, so the
# peripheral pushes that at the central 5s into every connection, replacing a
# more conservative value the central chose. 400 = 4.0s, Apple's accessory
# design guideline value.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
