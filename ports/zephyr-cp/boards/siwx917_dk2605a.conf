# The upstream board defconfig does not enable GPIO, so no gpio device structs
# are instantiated and CircuitPython's generated board.c fails to link with
# "undefined reference to __device_dts_ord_NN" for every pin.
CONFIG_GPIO=y

# getaddrinfo() calls k_calloc(), which is compiled out when the kernel heap is
# zero-sized. prj.conf also enables CONFIG_DYNAMIC_THREAD_ALLOC, which draws
# thread stacks from this same heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

# TCP is not enabled by any of the options above, and the siwx91x driver
# defaults to the native network stack. Wi-Fi association and DHCP still work
# because DHCP is UDP, so the board looks healthy while every SOCK_STREAM
# socket fails: the web workflow listener never opens and socketpool raises
# "Out of sockets" from Python.
CONFIG_NET_TCP=y

# Every Zephyr socket also takes a zvfs file descriptor, which defaults to 0.
CONFIG_ZVFS_OPEN_MAX=8

# Zephyr's console (printk, boot banner, driver logs) goes to SEGGER RTT over
# the existing SWD connection instead of sharing the UART with the REPL.
# CircuitPython's REPL is unaffected: supervisor/serial.c takes the device from
# DT_CHOSEN(zephyr_console) and drives it with busio directly, so it keeps
# ulpuart and the J-Link VCOM regardless of this Kconfig.
#
# Without this, every net event printk interleaves with the REPL and corrupts
# the raw REPL handshake that test tooling depends on.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y

CONFIG_BT_DEVICE_APPEARANCE_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=28
CONFIG_BT_L2CAP_TX_MTU=253

# Required for bt_gatt_service_register()/_unregister(): the GATT server
# built into common-hal/_bleio/Service.c registers services built up at
# runtime from Python, which needs the dynamic attribute table. Without this,
# linking bt_gatt_service_register fails.
CONFIG_BT_GATT_DYNAMIC_DB=y
# Long writes (queued prepare-write ATT ops) need at least one prepare slot;
# 0 silently rejects any write that doesn't fit in a single ATT_WRITE_REQ.
CONFIG_BT_ATT_PREPARE_COUNT=2

# --- Link supervision timeout. THIS IS THE FLAP KNOB (per Hermes/rex,
# ports/zephyr-cp/common-hal/_bleio, 2026-08-03).
#
# Zephyr's peripheral preferred-connection-parameter defaults are
# MIN_INT=24 (30ms), MAX_INT=40 (50ms), LATENCY=0, TIMEOUT=42 -- the last one
# is in 10ms units, so the default supervision timeout is 420ms. With
# CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y (also default) the host sends that
# preference to the central 5s into every connection, actively downgrading a
# link the central set up more conservatively.
#
# Measured on Hermes's board: central opened at timeout 72 (720ms), board
# talked it down to 42 (420ms) 5s later. At 420ms with a 30ms interval, 14
# consecutive missed connection events kill the link -- thin on a
# single-antenna coexisting part like this one, where the NWP is servicing
# Wi-Fi on the same radio.
#
# 400 = 4.0s, Apple's accessory guideline value.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# BT Buffers
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
# The controller reports 15 ACL TX buffers but the host was configured for 8:
#   <wrn> bt_hci_core: Num of Controller's ACL packets != ACL bt_conn_tx
#   contexts (15 != 8)
# Match the host to the controller so the host isn't the bottleneck on
# notification-heavy traffic.
CONFIG_BT_BUF_ACL_TX_COUNT=15
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_BUF_ACL_RX_SIZE=255

# DNS resolution: DHCP hands us a resolver, but the resolver subsystem has to
# be present for socketpool.getaddrinfo() and radio.ipv4_dns to work.
CONFIG_DNS_RESOLVER=y

# --- SPI (GSPI) — issue #3 ---
# The GSPI controller driver plus DMA. Matches the upstream Zephyr
# spi_loopback conf for this board
# (zephyr/tests/drivers/spi/spi_loopback/boards/siwx917_dk2605a.conf).
CONFIG_SPI=y
CONFIG_SPI_SILABS_SIWX91X_GSPI=y
CONFIG_SPI_SILABS_SIWX91X_GSPI_DMA=y
CONFIG_SPI_ASYNC=y
CONFIG_DMA=y

# --- ICM-40627 IMU — issue #4 ---
# NOTE: the in-tree driver is I2C-ONLY. drivers/sensor/tdk/icm40627/ ships
# icm40627_i2c.c and no SPI transport; ICM40627_BUS_SPI is defined in
# icm40627.h:16 and never referenced anywhere, and there is no
# invensense,icm40627-spi.yaml binding. So enabling this does NOT get the
# on-board IMU working over GSPI — a SPI transport has to be written first.
# Left commented rather than enabled so nothing silently half-configures.
# CONFIG_ICM40627=y
