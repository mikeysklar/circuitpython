# Net-core (nRF5340 cpunet) configuration for the hci_ipc image — single
# source, replacing upstream's extra-iso-bt_ll_sw_split.conf entirely.
#
# History: upstream split the old combined nrf5340_cpunet_iso-bt_ll_sw_split
# conf into prj.conf + extra-*.conf overlays. We first layered our overrides
# next to upstream's extra-iso overlay in the same EXTRA_CONF_FILE list, which
# collides: the overlay enables ISO and sets its buffer ints, our file
# disabled ISO, and the orphaned ints then fail Kconfig ("unsatisfied deps").
# Single-source design by Hermes (#the-forge, 2026-08-05): copy the overlay's
# controller baseline here, drop the ISO and extended-advertising content,
# pass ONLY this file. One source, no merge, nothing to contradict.
# (Merge-order footnote, also Hermes: cmake's zephyr_get(... MERGE REVERSE)
# reverses the sysbuild/local/cache/env *scopes*, not files within one value —
# so in-list order was never the problem; the collision was real.)
#
# The port intentionally carries socs/nrf5340_cpunet.conf with the same ISO
# disables, but that file has never applied: Zephyr resolves socs/ fragments
# from APPLICATION_CONFIG_DIR, which for the hci_ipc image is upstream's
# sample directory, not our port dir. This file is the seam that actually
# reaches the image (see sysbuild.cmake).
#
# Rationale for what's cut: CircuitPython's _bleio uses legacy advertising
# (bt_le_adv_start) and scanning only — zero bt_iso_*/bt_le_ext_adv_*/
# bt_le_per_adv_* call sites anywhere in the port (verified by grep, both
# trees). The ISO TX pool (12 × MTU 310) and the extended-advertising
# allocations (SCAN_DATA_LEN_MAX=1650, ADV_DATA_LEN_MAX=191, three _SET=3
# tables) are the RAM the net core cannot afford: it overflows by 820 bytes
# with them in (issue #41).

# --- Stack sizes: pre-rebase values (old combined conf), not the overlay's.
# The overlay raises ISR_STACK_SIZE to 1536 "across supported SoCs"; the old
# combined file used 1024 on cpunet and that is the measured-working value.
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=4096

# picolib: printf without 64-bit integer support (size)
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y

# Link-time optimization (size)
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# --- BT buffers (identical to both the old combined conf and the overlay)
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_BUF_ACL_RX_SIZE=255

# --- Host and Controller common: legacy roles only.
# BT_EXT_ADV / BT_PER_ADV / BT_PER_ADV_SYNC deliberately absent.
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=3

# --- Controller: split LL, no ISO, no extended advertising.
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_DTM_HCI=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_HCI_VS_FATAL_ERROR=y

# Rx ACL and Adv Reports
CONFIG_BT_CTLR_RX_BUFFERS=9
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Coded PHY support
CONFIG_BT_CTLR_PHY_CODED=y

# Control Procedure
CONFIG_BT_CTLR_LLCP_LOCAL_PROC_CTX_BUF_NUM=6

# --- Mbed TLS RAM tuning (from the overlay, unchanged): CSPRNG as PSA random
# source, ROM AES tables, 3 key slots (PSA is only AES-CMAC in hci_ipc).
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=3
