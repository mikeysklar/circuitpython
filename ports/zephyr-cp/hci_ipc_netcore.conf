# Net-core (nRF5340 cpunet) HCI sizing for the hci_ipc image.
#
# Upstream split samples/bluetooth/hci_ipc/nrf5340_cpunet_iso-bt_ll_sw_split.conf
# into prj.conf plus extra-*.conf overlays. The old combined file carried
# net-core-sized BT buffers and CONFIG_BT_MAX_CONN=3; the replacement prj.conf
# targets the generic sample and uses CONFIG_BT_MAX_CONN=16 with the buffer
# sizes commented out. On the nRF5340 network core that overflows RAM by
# ~1.3 KB at link time.
#
# Restore the values the pre-rebase build actually used, so this is a
# behavior-preserving migration rather than a resize.
CONFIG_BT_MAX_CONN=3

# extra-iso-bt_ll_sw_split.conf raises this to 1536 ("stack sizes across
# supported SoCs"); the old combined file used 1024 on cpunet.
CONFIG_ISR_STACK_SIZE=1024

CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_BUF_ACL_RX_SIZE=255
