# Test variant: the EK-RA8D1 build leaves the Cortex-M85 data cache off
# (CONFIG_CPU_HAS_DCACHE=y but "# CONFIG_DCACHE is not set") while the
# CircuitPython GC heap lives in the board 64 MB external SDRAM at 0x68000000.
# Every Python object access is therefore an uncached off-chip read. Turn the
# D-cache on to measure how much of the bytecode time that costs.
CONFIG_DCACHE=y

# CONFIG_DCACHE=y alone builds but SCB->CCR.DC stays clear: arch_dcache_enable()
# and the sys_cache_data_enable() call in soc/renesas/ra/common/soc.c are only
# live under CONFIG_CACHE_MANAGEMENT.
CONFIG_CACHE_MANAGEMENT=y
