# The native emitter writes machine code into SRAM and jumps to it. On the
# Cortex-M33, CONFIG_ARM_MPU=y force-selects SRAM_REGION_PERMISSIONS, which
# marks the heap non-executable, so the first native/viper call takes an MPU
# Instruction Access Violation. Disable the MPU so SRAM stays executable under
# the ARMv8-M default map (analog of the ESP32 branch memprot-off). This board
# has no USB, so its console is already on uart20 (the J-Link VCOM).
CONFIG_ARM_MPU=n
