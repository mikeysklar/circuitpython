# Native emitter writes machine code into SRAM and jumps to it. The default
# per-region SRAM permissions mark the heap non-executable (XN), so the MPU
# faults on the first native/viper call with an Instruction Access Violation.
# CONFIG_ARM_MPU selects (force-enables) SRAM_REGION_PERMISSIONS, so the NX
# marking cannot be dropped while the MPU is on. Disable the MPU outright: on
# ARMv8-M the default system memory map leaves SRAM executable. Mirrors the
# ESP32 native branch turning memory protection off.
CONFIG_ARM_MPU=n
