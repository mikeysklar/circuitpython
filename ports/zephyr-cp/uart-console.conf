# Matching Kconfig for uart-console.overlay: prj.conf force-enables the USB
# device stack, which has no controller once usbhs is disabled.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USBD_HID_SUPPORT=n
CONFIG_USBD_MSC_CLASS=n

# Native emitter writes machine code into SRAM and jumps to it. The default
# per-region SRAM permissions mark the heap non-executable (XN), so the M33
# MPU faults on the first native/viper call with an Instruction Access
# Violation. Drop the NX marking so emitted code can execute from RAM. The
# ESP32 native branch does the equivalent by turning memory protection off.
# CONFIG_ARM_MPU selects (force-enables) SRAM_REGION_PERMISSIONS, so the NX
# marking cannot be dropped while the MPU is on. Disable the MPU outright: on
# ARMv8-M the default system memory map leaves SRAM executable, so emitted
# native code runs. Mirrors the ESP32 native branch turning memprot off.
CONFIG_ARM_MPU=n
